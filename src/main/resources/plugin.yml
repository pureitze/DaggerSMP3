name: CustomDaggers
version: '1.0.0'
main: com.example.daggers.DaggersPlugin
api-version: '1.21'
author: YourName
description: Six custom daggers with unique passive and right-click abilities
commands:
  dagger:
    description: Gives you a custom dagger
    usage: /dagger <fire|ice|water|soul|darkness|backstab>
  drecipe:
    description: View dagger recipes, or edit them with the admin subcommand
    usage: /drecipe [admin]
permissions:
  customdaggers.admin:
    description: Allows use of /dagger to spawn daggers, and /drecipe admin to edit recipes
    default: op
